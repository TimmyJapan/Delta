name: Build Delta Emulator (.ipa)

on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub's UI

jobs:
  build:
    runs-on: macos-15 # FIX: Upgraded to macOS 15 runner
    
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          # FIX: Target Xcode 16 to support Project Format 77
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: |
          pod repo update
          pod install --repo-update

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -workspace Delta.xcworkspace -scheme Delta

      - name: Build and Package .ipa (Unsigned)
        run: |
          xcodebuild build \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -sdk iphoneos17.5 \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          # Create the Payload folder structure required for an IPA package
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/Delta.app build/Payload/
          cd build && zip -r Delta.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Unsigned-IPA
          path: build/Delta.ipa
