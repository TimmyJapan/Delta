name: Build Delta Emulator (.ipa)

on:
  workflow_dispatch: # GitHubのUIから手動で実行可能

jobs:
  build:
    # Swift 6.0をサポートするXcode 16を使うため、macos-15を強制指定
    runs-on: macos-15 
    
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          # Swift 6.0が含まれるXcode 16を選択
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: |
          pod repo update
          pod install --repo-update

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -workspace Delta.xcworkspace -scheme Delta

      - name: Build and Package .ipa (Unsigned)
        run: |
          # サーバーに存在するシミュレータ環境を利用して、Swift 6.0のビルドを強制突破
          xcodebuild build \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ANY_BUNDLE_IDENTIFIER_ALLOWED=YES

          # 生成されたバイナリを抽出し、SideStore等のサイドロードに対応したIPA構造を作成
          mkdir -p build/Payload
          cp -R build/Release-iphonesimulator/Delta.app build/Payload/
          
          # 競合を防ぐため、内部の不完全な署名データを削除
          rm -rf build/Payload/Delta.app/_CodeSignature
          
          # パッケージング
          cd build && zip -r Delta.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Unsigned-IPA
          path: build/Delta.ipa

