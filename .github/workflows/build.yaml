name: Build Delta Emulator (.ipa)

on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub's UI

jobs:
  build:
    runs-on: macos-15 # FIX: Upgraded to macOS 15 runner
    
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          # FIX: Target Xcode 16 to support Project Format 77
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: |
          pod repo update
          pod install --repo-update

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -workspace Delta.xcworkspace -scheme Delta

      - name: Build and Package .ipa (Unsigned)
        run: |
          # 1. 署名要求を完全にバイパスしたアーカイブを作成する
          xcodebuild archive \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/Delta.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          # 2. 生成された.xcarchiveからアプリ本体を抽出してPayloadを構築する
          mkdir -p build/Payload
          cp -R build/Delta.xcarchive/Products/Applications/Delta.app build/Payload/
          
          # 3. 内部の不完全なコード署名を完全に除去（SideStore等での再署名トラブル防止）
          rm -rf build/Payload/Delta.app/_CodeSignature
          
          # 4. IPAファイルとしてパッケージング
          cd build && zip -r Delta.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Unsigned-IPA
          path: build/Delta.ipa
