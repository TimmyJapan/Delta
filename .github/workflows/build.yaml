name: Build Delta Emulator (.ipa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Swift 6.0のためにXcode 16環境を維持
    
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: |
          pod repo update
          pod install --repo-update

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -workspace Delta.xcworkspace -scheme Delta

      - name: Build and Package .ipa (Unsigned)
        run: |
          # SDK不足の判定を回避するため、内部のデプロイターゲットを一括でiOS 17に引き下げて強制ビルドします
          xcodebuild build \
            -workspace Delta.xcworkspace \
            -scheme Delta \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ANY_BUNDLE_IDENTIFIER_ALLOWED=YES \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            MARKETING_VERSION=1.6

          # IPAパッケージに必要なPayloadフォルダ構造の作成
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/Delta.app build/Payload/
          
          # 内部の不完全なコード署名を削除してSideStore等のエラーを防止
          rm -rf build/Payload/Delta.app/_CodeSignature
          
          # パッケージング
          cd build && zip -r Delta.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Unsigned-IPA
          path: build/Delta.ipa


